# TypeScript for the public API in ../api (Protobuf + Connect); `pnpm gen:api` runs it with the root Makefile's buf,
# `pnpm gen:api:check` fails when the committed code is stale. The code is committed, so a Vercel build needs no buf.
# protoc-gen-es is pinned in package.json and runs locally (no remote plugins). Do not edit src/generated by hand.
version: v2
# Empty the out directory first, so a deleted proto leaves no stale file.
clean: true
plugins:
  - local: [pnpm, exec, protoc-gen-es]
    out: src/generated
    opt: target=ts
inputs:
  - directory: ../api
  # Error details are google.rpc's standard types; the BSR commit pins their version. Go uses genproto's errdetails.
  - module: buf.build/googleapis/googleapis:c17df5b2beca46928cc87d5656bd5343
    paths:
      - google/rpc/error_details.proto
