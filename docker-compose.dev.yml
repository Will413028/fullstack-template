services:
  # `make dev` runs `docker compose up --watch`: a change under backend/ rebuilds the image and restarts it
  backend:
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - bin/

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/messages:/app/messages
      - ./frontend/public:/app/public

  # The browser goes through caddy in dev too, the same /api routing as production: http://localhost:3000.
  # Loopback only, and not port 80: Docker Desktop on macOS needs its privileged helper to bind a port below 1024
  # on a specific address.
  caddy:
    ports: !override
      - "127.0.0.1:3000:80"
