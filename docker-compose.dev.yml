services:
  # `make dev` runs `docker compose up --watch`: a change under backend/ rebuilds the image and restarts it
  backend:
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - bin/

  frontend:
    build:
      context: ./frontend
      target: base
    command: ["pnpm", "dev"]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/messages:/app/messages
      - ./frontend/public:/app/public

  # the browser goes through caddy in dev too, the same /api routing as production; loopback only
  caddy:
    ports: !override
      - "127.0.0.1:80:80"
