services:
  # `make dev` runs `docker compose up --watch`: a change under backend/ rebuilds the image and restarts it.
  # The frontend runs on the host (`pnpm dev` in frontend/), and its dev rewrite sends /api here: next dev cannot add
  # the X-Origin-Secret header caddy requires, so dev skips caddy (docs/adr/2026-11-03-frontend-on-vercel.md).
  # Loopback only: ports Docker publishes bypass ufw.
  backend:
    ports:
      - "127.0.0.1:8000:8000"
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - bin/

  # Started only with `--profile caddy`, to try the production entry locally.
  caddy:
    profiles: [caddy]
