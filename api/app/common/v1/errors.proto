syntax = "proto3";

package app.common.v1;

// Errors are a Connect code plus google.rpc details (docs/rules/api-design.md): ErrorInfo carries a reason when a client
// needs to tell one failure from another with the same code, and BadRequest lists the invalid fields. The server sends
// no text for users: clients translate the code, the reason and each field violation's reason
// (docs/adr/2026-11-03-api-contract-protobuf-connect.md D3).
//
// The value names are the strings on the wire, so they carry no prefix (api/buf.yaml). New values may be added; a value
// on main is never renamed, removed or given a different code. A client that does not know a value falls back to the
// code.

// ErrorReason is google.rpc.ErrorInfo.reason; the domain is ErrorInfo's domain in internal/httpapi/rpc.
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  // The account name is in use (already_exists).
  ACCOUNT_TAKEN = 1;
  // The account or the password is wrong, or the account is disabled; the three look the same (unauthenticated).
  // Clients stay on the sign-in form instead of redirecting to it.
  INVALID_CREDENTIALS = 2;
  // Too many failed sign-ins for this account from an untrusted browser (resource_exhausted, with RetryInfo).
  LOGIN_THROTTLED = 3;
  // The change would leave no enabled admin (failed_precondition).
  LAST_ADMIN = 4;
  // The session must have signed in within the last 10 minutes (permission_denied).
  REAUTHENTICATION_REQUIRED = 5;
  // The session cookie is missing, expired or revoked (unauthenticated).
  SESSION_INVALID = 6;
  // The signed-in user's role may not call this method (permission_denied).
  INSUFFICIENT_ROLE = 7;
  // A browser sent a state-changing request from another origin (permission_denied).
  CROSS_ORIGIN_REQUEST = 8;
}

// FieldViolationReason is google.rpc.BadRequest.FieldViolation.reason (AIP-193); the field is the request field's path.
enum FieldViolationReason {
  FIELD_VIOLATION_REASON_UNSPECIFIED = 0;
  // The field is empty or unset.
  REQUIRED = 1;
  // The value is shorter than the field allows.
  TOO_SHORT = 2;
  // The value is longer than the field allows.
  TOO_LONG = 3;
  // The value does not have the field's format (for example characters an account name may not contain).
  PATTERN = 4;
  // A number is outside the field's range.
  OUT_OF_RANGE = 5;
  // The value is not one the field accepts, for example an id that is not a UUID or a page token this API did not
  // return.
  INVALID = 6;
  // The password is on the list of common or breached passwords.
  PASSWORD_TOO_COMMON = 7;
}
