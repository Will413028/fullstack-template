syntax = "proto3";

package app.admin.users.v1;

import "app/users/v1/users.proto";
import "google/protobuf/field_mask.proto";

// Account management for admins (backend/internal/modules/auth). A signed-in user who is not an admin gets
// permission_denied (INSUFFICIENT_ROLE). Every change is written to the audit log.

// SignInLock is the sign-in throttle of an account for clients without a trusted-device cookie for it.
message SignInLock {
  // Sign-ins from clients without a trusted-device cookie for the account are refused.
  bool locked = 1;
  // Failed sign-ins from such clients since the last successful one; the lock starts at 100.
  int32 failures = 2;
}

// UserAdminService needs a signed-in admin.
service UserAdminService {
  // Every account, disabled ones included, newest first, a page at a time (AIP-158).
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Any account.
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Changes the fields update_mask lists (AIP-134); disabled is the only one. Disabling an account ends all its
  // sessions. The only enabled admin cannot be disabled (failed_precondition, LAST_ADMIN).
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  // Deletes an account and everything it owns. The admin's session must have signed in within the last 10 minutes
  // (permission_denied, REAUTHENTICATION_REQUIRED); the only enabled admin cannot be deleted (failed_precondition,
  // LAST_ADMIN).
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  // The sign-in throttle of an account.
  rpc GetSignInLock(GetSignInLockRequest) returns (GetSignInLockResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Forgets every failed sign-in counted for an account, from all clients (AIP-136 custom method).
  rpc ResetSignInLock(ResetSignInLockRequest) returns (ResetSignInLockResponse);
}

message ListUsersRequest {
  // At most this many users: 20 when 0, at most 100 (a larger value is read as 100); negative is invalid_argument.
  int32 page_size = 1;
  // A previous response's next_page_token; empty for the first page. A token this API did not return is
  // invalid_argument.
  string page_token = 2;
}

message ListUsersResponse {
  repeated app.users.v1.User users = 1;
  // The token for the next page; empty on the last page.
  string next_page_token = 2;
}

message GetUserRequest {
  // The user's id.
  string id = 1;
}

message GetUserResponse {
  app.users.v1.User user = 1;
}

message UpdateUserRequest {
  // user.id names the account; the fields update_mask lists are set from user.
  app.users.v1.User user = 1;
  // The fields to change: disabled, or "*". A listed disabled that is unset is false (AIP-134: a listed field takes the
  // request's value, unset is the default), which enables the account. Without a mask, disabled is changed when it is
  // set. The fields the server sets (id, account, role, create_time) are ignored when listed; any other path is
  // invalid_argument.
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateUserResponse {
  app.users.v1.User user = 1;
}

message DeleteUserRequest {
  // The user's id.
  string id = 1;
}

message DeleteUserResponse {}

message GetSignInLockRequest {
  // The user's id.
  string user_id = 1;
}

message GetSignInLockResponse {
  SignInLock sign_in_lock = 1;
}

message ResetSignInLockRequest {
  // The user's id.
  string user_id = 1;
}

message ResetSignInLockResponse {}
