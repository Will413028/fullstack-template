version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gocritic
    - gosec
    - nilerr
    - noctx
  settings:
    gocritic:
      disable-all: true
      enabled-tags:
        - diagnostic
    depguard:
      rules:
        # Layering: modules hold services, stores and sqlc code; they never touch HTTP or the composition root.
        # Module-to-module imports and transitive dependencies of non-test code are checked by internal/archtest,
        # which covers new modules without a rule per module. Test files may import another module to build fixtures
        # (items tests create users through auth to satisfy items.owner_id -> users.id).
        modules-no-http:
          list-mode: lax
          files:
            - "**/internal/modules/**"
          deny:
            - pkg: net/http
              desc: modules do not handle HTTP; handlers live in internal/httpapi
            - pkg: github.com/Will413028/fullstack-template/backend/internal/httpapi
              desc: modules must not depend on the HTTP layer
            - pkg: github.com/Will413028/fullstack-template/backend/cmd
              desc: modules must not depend on the composition root
        platform-no-upward:
          list-mode: lax
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: github.com/Will413028/fullstack-template/backend/internal/modules
              desc: platform is the bottom layer and must not depend on modules
            - pkg: github.com/Will413028/fullstack-template/backend/internal/httpapi
              desc: platform is the bottom layer and must not depend on the HTTP layer
        standard-library-log:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: log$
              desc: use log/slog
        production-random:
          list-mode: lax
          files:
            - "!$test"
          deny:
            - pkg: math/rand$
              desc: use math/rand/v2 or crypto/rand
  exclusions:
    generated: strict

formatters:
  enable:
    - gofmt
