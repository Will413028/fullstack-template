# items module: the schema includes auth's schema.sql only so sqlc resolves items.owner_id -> users.id; the queries
# must not read users. Generated code goes to internal/store (Go's internal keeps other modules out); never
# edit it by hand. Run make sqlc from backend/.
version: "2"
sql:
  - engine: postgresql
    schema: [../auth/schema.sql, schema.sql]
    queries: queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        # The auth tables are in the schema only for the foreign key; do not generate structs for them.
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
