# oapi-codegen v2.8.0 settings (version pinned in backend/Makefile). Run from backend/: make gen.
# No output: the code goes to stdout, so make gen-check can generate into a temporary file and compare.
package: gen
generate:
  models: true
  std-http-server: true
  strict-server: true
output-options:
  # Keep the shared components (Problem, parameters, responses) before any operation references them.
  skip-prune: true
  # `nullable: true` fields become nullable.Nullable[T], which tells an omitted field from an explicit null: JSON
  # Merge Patch needs the difference (`description: null` clears, omitted leaves unchanged).
  nullable-type: true
