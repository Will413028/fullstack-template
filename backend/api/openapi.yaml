# The API contract and its single source (plan I1): shapes, length and format limits and enums are written only here.
# The backend generates internal/httpapi/gen from it (make gen) and validates every /api request against it; the
# frontend generates its types from it. OpenAPI 3.0.3: oapi-codegen v2.8.0 marks its 3.1 support as initial.
openapi: 3.0.3
info:
  title: Fullstack Template API
  version: 0.1.0
  description: |
    Errors are RFC 9457 problem details (`application/problem+json`). Clients choose messages by `type` and `code`
    and never parse `detail`.
servers:
  - url: /api
security:
  - sessionCookie: []
paths:
  /users:
    post:
      operationId: createUser
      summary: Create an account and sign in to it.
      description: Creates a `user` account and a session; the session cookie is set on the response.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: The account was created and signed in.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /users/me:
    get:
      operationId: getCurrentUser
      summary: The signed-in user.
      tags: [auth]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /users/{id}:
    patch:
      operationId: patchUser
      summary: Change a user (admin only).
      description: |
        JSON Merge Patch (RFC 7396): omitted fields are left unchanged. Disabling a user signs them out everywhere.
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UserPatch"
      responses:
        "200":
          description: The user after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions:
    post:
      operationId: createSession
      summary: Sign in.
      description: |
        Always issues a new session and ends the one the request carried, if any. A wrong password, an unknown
        account and a disabled account get the same 401. After repeated failures the account name waits before the
        next attempt (429), whether or not the account exists.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Signed in.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteAllSessions
      summary: Sign out everywhere.
      description: Ends every session of the signed-in user, this one included, and clears the cookie.
      tags: [auth]
      responses:
        "204":
          description: Signed out everywhere.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearSessionCookie"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/current:
    delete:
      operationId: deleteCurrentSession
      summary: Sign out.
      description: Ends the session the request carries and clears the cookie. Succeeds without a valid session too.
      tags: [auth]
      security: []
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearSessionCookie"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /items:
    post:
      operationId: createItem
      summary: Create an item owned by the signed-in user.
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemRequest"
      responses:
        "201":
          description: The item was created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listItems
      summary: The signed-in user's items, newest first.
      description: Keyset pagination; pass `next_cursor` back as `cursor` until it is null.
      tags: [items]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getItem
      summary: One of the signed-in user's items.
      description: Another user's item is a 404, the same as an item that does not exist.
      tags: [items]
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateItem
      summary: Change one of the signed-in user's items.
      description: |
        JSON Merge Patch (RFC 7396): omitted fields are left unchanged and `description: null` clears the
        description. `title` cannot be null.
      tags: [items]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/ItemPatch"
      responses:
        "200":
          description: The item after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteItem
      summary: Delete one of the signed-in user's items.
      tags: [items]
      responses:
        "204":
          description: The item was deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
      description: |
        Opaque session token, HttpOnly. Named `session` instead when the server runs with COOKIE_SECURE=false (local
        http development), because the `__Host-` prefix requires Secure.
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `next_cursor`; omit for the first page.
      schema:
        type: string
  headers:
    Location:
      description: The URL of the created resource.
      schema:
        type: string
    SetSessionCookie:
      description: The new session cookie.
      schema:
        type: string
    ClearSessionCookie:
      description: Expires the session cookie.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
  schemas:
    User:
      type: object
      required: [id, account, role, is_disabled, created_at]
      properties:
        id:
          type: string
          format: uuid
        account:
          type: string
          description: Lowercase; accounts are unique regardless of case.
        role:
          type: string
          enum: [admin, user]
        is_disabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [account, password]
      properties:
        account:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[A-Za-z0-9_.-]+$"
          description: Stored lowercase.
        password:
          type: string
          minLength: 15
          maxLength: 128
          description: |
            15 to 128 characters (code points), no composition rules (NIST SP 800-63B-4). A password on the common or
            breached password list is rejected with code `password_too_common`.
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [account, password]
      properties:
        account:
          type: string
          minLength: 1
          maxLength: 50
          description: Case-insensitive.
        password:
          type: string
          minLength: 1
          maxLength: 128
    UserPatch:
      type: object
      additionalProperties: false
      properties:
        is_disabled:
          type: boolean
    Item:
      type: object
      required: [id, title, description, owner_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        owner_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ItemPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page; null on the last page.
    CreateItemRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          $ref: "#/components/schemas/ItemTitle"
        description:
          type: string
          nullable: true
    ItemPatch:
      type: object
      additionalProperties: false
      properties:
        title:
          $ref: "#/components/schemas/ItemTitle"
        description:
          type: string
          nullable: true
    ItemTitle:
      type: string
      minLength: 1
      maxLength: 200
      description: 1 to 200 characters (code points).
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Fixed per kind of problem, for example `/problems/not-found`.
          example: /problems/not-found
        title:
          type: string
          description: Fixed per `type`.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: Human-readable explanation for developers; clients must not parse it.
        code:
          type: string
          description: Stable machine-readable code refining `type`, for example `account_taken`.
        request_id:
          type: string
          description: The request's `X-Request-ID`, for matching a report with the server logs.
    ValidationProblem:
      description: A problem with type `/problems/validation`, listing each invalid input.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [pointer, code, detail]
      properties:
        pointer:
          type: string
          description: |
            JSON Pointer (RFC 6901) to the invalid value in the request body, or `/<name>` for a query or path
            parameter. Empty when the whole body is missing.
          example: /title
        code:
          type: string
          description: |
            Stable machine-readable code: `required`, `too_short`, `too_long`, `pattern`, `enum`, `format`,
            `out_of_range`, `invalid_type`, `null_not_allowed`, `additional_property`, `invalid`, or a
            business rule such as `password_too_common`.
          example: too_short
        detail:
          type: string
          description: Human-readable explanation for developers; clients must not parse it.
  responses:
    BadRequest:
      description: The request is malformed, for example a body that is not valid JSON.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: No valid session.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated but not allowed, or a cross-origin state-changing request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with the current state, for example a taken account.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: The request body is over the size limit.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The request body's Content-Type is not one the operation accepts.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: The request does not match the contract or a business rule.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: An unexpected error; details are only in the server log.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
