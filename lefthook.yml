pre-commit:
  parallel: true
  commands:
    prevent-env-leak:
      tags: security
      run: >-
        git diff --cached --name-only | grep -E '^(\.env)$' &&
        echo "⚠️ Error: You are trying to commit a .env file containing sensitive credentials. Git commit rejected." &&
        exit 1 || exit 0
    frontend-lint:
      root: frontend/
      glob: "*.{ts,tsx}"
      run: npx --no -- biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
      priority: 1
    frontend-types:
      root: frontend/
      glob: "*.{ts,tsx}"
      run: pnpm tsc --noEmit
      priority: 2
    backend-format:
      root: backend/
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
      priority: 1
    # golangci-lint checks packages, not single files: only issues on lines changed since HEAD are reported
    backend-lint:
      root: backend/
      glob: "*.go"
      run: make --no-print-directory bin/golangci-lint && bin/golangci-lint run --new-from-rev=HEAD ./...
      priority: 2

# CI's checks, minus the compose stack job (it builds every image): a push to main is stopped here even when CI has
# not run yet. The security tools are local binaries (brew install actionlint zizmor gitleaks osv-scanner).
pre-push:
  parallel: true
  commands:
    backend-check:
      root: backend/
      run: make --no-print-directory check BASE=origin/main
    frontend-check:
      root: frontend/
      run: pnpm audit --prod --audit-level high && pnpm gen:api:check && pnpm lint && pnpm check:deps && pnpm check:arch && pnpm test:report && pnpm build && cd .. && python3 scripts/check_locks.py --vitest-report frontend/test-report.json
    # osv-scanner gets each tracked lockfile by name: its recursive walk honours a parent repository's .gitignore,
    # so a clone nested in an ignored directory would scan nothing and fail.
    security:
      run: >-
        actionlint && zizmor --offline .github/workflows && gitleaks git --redact --no-banner . &&
        osv-scanner scan source $(git ls-files 'go.mod' '**/go.mod' 'pnpm-lock.yaml' '**/pnpm-lock.yaml' | sed 's/^/-L /')

commit-msg:
  commands:
    conventional-commit:
      run: |
        first_line="$(head -n1 {1})"
        if [[ "$first_line" =~ ^(fixup|squash)!\  ]]; then exit 0; fi
        pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_./-]+\))?!?: .+'
        if ! [[ "$first_line" =~ $pattern ]]; then
          echo "commit message 不符合 Conventional Commits 規範" >&2
          echo "格式: <type>(<scope>)?: <subject>（feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert）" >&2
          echo "你的訊息: $first_line" >&2
          exit 1
        fi
        subject="${first_line#*: }"
        if [[ "${subject:0:1}" =~ [A-Z] ]]; then
          echo "commit message 不符合 Conventional Commits 規範: subject 開頭不可大寫" >&2
          exit 1
        fi
        if [[ "$subject" == *. ]]; then
          echo "commit message 不符合 Conventional Commits 規範: subject 結尾不可加句號" >&2
          exit 1
        fi
