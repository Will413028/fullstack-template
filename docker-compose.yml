services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    volumes:
      # 18+ keeps data in a versioned subdirectory; mount the parent (docker-library/postgres#37)
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # applies backend/migrations (the deploy env in atlas.hcl reads DATABASE_URL); backend starts after it exits
  migrate:
    build: ./backend
    env_file: .env
    entrypoint: ["/usr/local/bin/atlas"]
    command: ["migrate", "apply", "--env", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    restart: unless-stopped
    # covers the 5s readiness drain plus up to 20s of graceful shutdown
    stop_grace_period: 30s
    env_file: .env
    # loopback only: ports published by Docker bypass ufw
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        # browser-facing URL, inlined into the client bundle at build time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    env_file: .env
    environment:
      # server-side (SSR/RSC) fetches reach the backend by service name
      API_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
