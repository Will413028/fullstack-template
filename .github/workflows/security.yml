name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # new advisories land without any commit here, so main is rescanned weekly
  schedule:
    - cron: "0 3 * * 1"
  # Other repositories run the same checks by calling this workflow at a pinned commit:
  #   uses: Will413028/fullstack-template/.github/workflows/security.yml@<sha> # <tag>
  # A caller's scheduled run gets only the vulnerability scan, as here. Projects made from this template keep their
  # own copy of this file instead of calling it.
  workflow_call:
    inputs:
      osv-scan-args:
        description: Arguments for osv-scanner scan source, e.g. "-L backend/uv.lock -L web/pnpm-lock.yaml"
        type: string
        default: --recursive ./

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflow lint (actionlint + zizmor)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.30.1
          advanced-security: false  # fail the job instead of uploading SARIF (needs GHAS on private repos)

  secrets:
    name: Secret scan (gitleaks)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # scan full history, not just the tip
          persist-credentials: false
      # The CLI image, not gitleaks-action: the action needs a paid license on organization repos.
      - uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: git --redact --no-banner --verbose .


  # Every lockfile, dev dependencies included: pnpm audit in CI covers only production packages.
  vulnerabilities:
    name: Vulnerability scan (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: ${{ inputs.osv-scan-args || '--recursive ./' }}
