name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test + vuln)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Atlas standard build (checksum-verified) for migration generation and drift checks
      - run: make tools
      - run: make check
      - run: make atlas-age

  # Builds the production backend image and applies migrations with the Atlas build that ships in it.
  stack:
    name: Compose stack (image + migrate + health)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: cp .env-example .env
      - run: docker compose up -d --build --wait backend
      - name: Migrate exited cleanly and backend is ready
        run: |
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = 0
          curl -fsS http://127.0.0.1:8000/health/ready
      - if: failure()
        run: docker compose logs

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check git hooks were installed
        run: test -x "$(git rev-parse --git-path hooks)/commit-msg"
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm check:deps
      - run: pnpm test
      - run: pnpm build
