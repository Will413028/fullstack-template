name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # main runs are never cancelled: the existing-migrations check compares each push with the previous one, so a
  # cancelled run would let the next push treat a modified migration as the base.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (lint + test + vuln)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: the existing-migrations check needs the merge-base with the base branch
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          # the dev tools build from their own module, backend/tools/
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum
      # squawk installs from backend/tools/package-lock.json with npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Atlas standard build (checksum-verified) for migration generation and drift checks
      - run: make tools
      - name: make check
        env:
          EVENT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          base="$EVENT_BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base=HEAD~1; fi
          make check BASE="$base"
      # Reported, not gated: total coverage, plus changed-line coverage against the PR base on pull requests
      - name: Coverage report
        env:
          COVER_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: make -s coverage COVER_BASE="$COVER_BASE" >> "$GITHUB_STEP_SUMMARY"
      - run: make atlas-age
      # suppression comments may only go down and executed tests only up (scripts/quality-locks.json)
      - run: python3 scripts/check_locks.py --go-test-report backend/test-report.json
        working-directory: .

  # Every commit that edits a checker's configuration or moves a lock the bad way names why in a Quality-Gate trailer
  # (scripts/check_commit_policy.py; lefthook checks it at commit time too).
  policy:
    name: Commit policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      # the Atlas build the image applies migrations with is the one the tests use (backend/Makefile, Dockerfile)
      - run: python3 scripts/tool_versions.py verify
      - name: Check the commits being added
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then range="$HEAD_SHA~1..$HEAD_SHA"
          else range="$BASE..$HEAD_SHA"; fi
          python3 scripts/check_commit_policy.py --range "$range"

  # >>> template-only
  # A project starts with `make new`: generate one, then check that the new module path reached every file, the
  # regenerated Connect code is current and loads, and the frontend still type-checks. This job and its comments are
  # left out of the generated project.
  generate:
    name: Generate a project (make new)
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          # the protoc plugins build from the dev tools' module, backend/tools/
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          working-directory: frontend
          runtime: node@26
          cache: true
          require-lockfile: true
      - run: python3 -m unittest discover -s template -p 'test_*.py'
      # A repository other than the default (Will413028/<NAME>) that names the project: it must be written as given.
      - run: make new NAME=ci-probe DEST="$RUNNER_TEMP/ci-probe" REPO=ci-owner/ci-probe-fork
      - name: One commit, no remote, the commit policy passes
        working-directory: ${{ runner.temp }}/ci-probe
        run: |
          test "$(git rev-list --count HEAD)" = 1
          test "$(git branch --format='%(refname:short)')" = main
          test -z "$(git remote)"
          test -z "$(git status --porcelain)"
          python3 scripts/check_commit_policy.py --range HEAD
      - name: Nothing names the template; the module path and links follow the given repository
        working-directory: ${{ runner.temp }}/ci-probe
        run: |
          if git grep -n -i -E 'template[-_]go[-_]nextjs|Will413028/ci-probe' ; then
            echo "files above name the template or the default repository"; exit 1
          fi
          test "$(cd backend && go list -m)" = github.com/ci-owner/ci-probe-fork/backend
          grep -F 'github.com/ci-owner/ci-probe-fork/security/advisories/new' SECURITY.md ||
            { echo "SECURITY.md does not link to ci-owner/ci-probe-fork"; exit 1; }
      # The generated code carries the module path inside each raw descriptor: regenerating changes nothing more, and
      # loading the descriptors (the rpc tests) does not panic.
      - name: Backend in the generated project
        working-directory: ${{ runner.temp }}/ci-probe
        run: |
          make bin/buf
          make -C backend gen-check
          cd backend && go vet ./... && go test ./internal/httpapi/rpc/...
      - name: Frontend and repo scripts in the generated project
        working-directory: ${{ runner.temp }}/ci-probe
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          cd frontend && pnpm install --frozen-lockfile && pnpm lint
  # <<< template-only

  # Builds the production backend image and applies migrations with the Atlas build that ships in it.
  stack:
    name: Compose stack (image + migrate + health)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint-docker
      # .env and the password files under .secrets/, as a developer gets them
      - run: make init-env
      - name: Each service gets only its own secrets
        run: |
          docker compose config --format json > /tmp/compose.json
          test "$(jq -c '.services.backend.secrets | map(.source)' /tmp/compose.json)" = '["db_app_password"]'
          test "$(jq -c '.services.migrate.secrets | map(.source)' /tmp/compose.json)" = '["db_owner_password"]'
          test "$(jq -c '.services.caddy.secrets | map(.source)' /tmp/compose.json)" = '["origin_secret","origin_secret_previous"]'
      # Logs hold client addresses and paths: every service rotates them (docs/privacy/data-inventory.md)
      - name: Every service rotates its logs
        run: test "$(jq -c '[.services | to_entries[] | select(.value.logging.options["max-size"] == null) | .key]' /tmp/compose.json)" = '[]'
      # Published ports bypass ufw: only caddy may have any (docs/adr/2026-10-18-api-and-auth-baseline.md D1)
      - name: Only caddy publishes ports
        run: test "$(jq -c '[.services | to_entries[] | select(.value.ports) | .key]' /tmp/compose.json)" = '["caddy"]'
      - run: docker compose up -d --build --wait
      - name: Migrate exited cleanly and backend is ready
        run: |
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = 0
          docker compose exec -T backend /usr/local/bin/app healthcheck
      # Caddy is the API's entry for Vercel (docs/adr/2026-11-03-frontend-on-vercel.md); these requests play Vercel's
      # edge, which sends the origin secret, X-Real-IP and X-Forwarded-Host.
      - name: Caddy passes only requests that carry the origin secret
        run: |
          secret="$(cat .secrets/origin_secret)"
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          # a Connect read: GET with the request message in the query (NO_SIDE_EFFECTS)
          me='http://localhost/api/app.users.v1.UserAppService/GetCurrentUser?connect=v1&encoding=json&message=%7B%7D'
          test "$(code "$me")" = 403
          test "$(code -H 'X-Origin-Secret: wrong' "$me")" = 403
          # origin_secret_previous is empty outside a rotation: an empty header must not match it
          test "$(code -H 'X-Origin-Secret;' "$me")" = 403
          test "$(code -H "X-Origin-Secret: $secret" http://localhost/en/login)" = 404
          test "$(code -H "X-Origin-Secret: $secret" -H 'X-Forwarded-Host: localhost' "$me")" = 401
          # caddy's access log records request headers: the secret must not be written there
          if docker compose logs caddy | grep -qF "$secret"; then echo "caddy logged the origin secret"; exit 1; fi
      - name: Caddy hands the backend Vercel's client address, request id and site host
        run: |
          secret="$(cat .secrets/origin_secret)"
          me='http://localhost/api/app.users.v1.UserAppService/GetCurrentUser?connect=v1&encoding=json&message=%7B%7D'
          # the backend believes caddy's request id, so caddy must not pass on the client's, or a client could write
          # any string into the log
          id="$(curl -s -o /dev/null -D - -H "X-Origin-Secret: $secret" -H 'X-Forwarded-Host: localhost' -H 'X-Request-ID: client-chosen' "$me" | tr -d '\r' | awk -F': ' 'tolower($1) == "x-request-id" {print $2}')"
          test -n "$id" && test "$id" != client-chosen
          # the client address the backend logs is the X-Real-IP Vercel wrote, not caddy's peer or a client's XFF
          curl -s -o /dev/null -H "X-Origin-Secret: $secret" -H 'X-Forwarded-Host: localhost' -H 'X-Real-IP: 203.0.113.7' -H 'X-Forwarded-For: 198.51.100.9' "$me"
          docker compose logs backend | grep -F "$id" > /dev/null
          docker compose logs backend | grep 'GetCurrentUser' | grep -F '203.0.113.7' > /dev/null
          if docker compose logs backend | grep -qF '198.51.100.9'; then echo "the backend took the client's X-Forwarded-For"; exit 1; fi
          # an old browser without Sec-Fetch-Site: CrossOriginProtection compares Origin with Host, which caddy sets
          # to the site's host, so a same-site sign-in is not rejected as cross-origin
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "X-Origin-Secret: $secret" -H 'X-Forwarded-Host: app.example.com' -H 'Origin: https://app.example.com' -H 'Content-Type: application/json' -d '{"account":"nobody","password":"wrong-password-123"}' http://localhost/api/app.sessions.v1.SessionPublicService/CreateSession)" = 401
      # The session cookie a sign-up sets through caddy reads the user back with a Connect GET; without it the read is
      # unauthenticated
      - name: A Connect GET carries the session cookie
        run: |
          secret="$(cat .secrets/origin_secret)"
          api() { curl -s -H "X-Origin-Secret: $secret" -H 'X-Forwarded-Host: localhost' "$@"; }
          me='http://localhost/api/app.users.v1.UserAppService/GetCurrentUser?connect=v1&encoding=json&message=%7B%7D'
          cookie="$(api -o /dev/null -D - -X POST -H 'Content-Type: application/json' \
            -d '{"account":"ci-probe","password":"ci probe 7f3a9c2e5b81 passphrase"}' \
            http://localhost/api/app.users.v1.UserPublicService/CreateUser \
            | tr -d '\r' | awk -F': ' 'tolower($1) == "set-cookie" {split($2, c, ";"); print c[1]; exit}')"
          test -n "$cookie"
          api -H "Cookie: $cookie" "$me" | jq -e '.user.account == "ci-probe"' > /dev/null
          test "$(api -o /dev/null -w '%{http_code}' "$me")" = 401
      - name: The app role cannot change the schema
        run: |
          out="$(docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U template_go_nextjs_app -d template_go_nextjs -c 'CREATE TABLE intruder (id int)' 2>&1)" && exit 1
          echo "$out"
          grep -q 'permission denied for schema public' <<< "$out"
      - if: failure()
        run: docker compose logs

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node.js 26 and the pnpm version in package.json's packageManager, then pnpm install --frozen-lockfile with the
      # store cached. pnpm/setup succeeds pnpm/action-setup for pnpm 11 and newer.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          working-directory: frontend
          runtime: node@26
          cache: true
          require-lockfile: true
      - name: Check git hooks were installed
        run: test -x "$(git rev-parse --git-path hooks)/commit-msg"
      - run: pnpm audit --prod --audit-level high
      # src/generated must match the contract in api/, with the pinned buf (root Makefile, checksum-verified)
      - run: make bin/buf
        working-directory: .
      - run: pnpm gen:api:check
      - run: pnpm lint
      - run: pnpm check:deps
      - run: pnpm check:arch
      - run: pnpm test:report
      # suppression comments may only go down and executed tests only up (scripts/quality-locks.json)
      - run: python3 scripts/check_locks.py --vitest-report frontend/test-report.json
        working-directory: .
      - run: pnpm build
      # every script of the built pages carries the CSP nonce, 404s included (vitest renders no pages)
      - run: python3 scripts/check_built_pages.py
        working-directory: .

  gate:
    # The only required check on main: it passes when every other job in this workflow succeeded or was skipped.
    name: gate (ci)
    if: always()
    needs:
      - backend
      - policy
      - stack
      - frontend
      # >>> template-only
      - generate
      # <<< template-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a needed job ended with: $r"; exit 1 ;; esac
          done
