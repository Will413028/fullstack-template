name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # main runs are never cancelled: the existing-migrations check compares each push with the previous one, so a
  # cancelled run would let the next push treat a modified migration as the base.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (lint + test + vuln)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # full history: the existing-migrations check needs the merge-base with the base branch
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # squawk runs through npx
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # Atlas standard build (checksum-verified) for migration generation and drift checks
      - run: make tools
      - name: make check
        env:
          EVENT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          base="$EVENT_BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base=HEAD~1; fi
          make check BASE="$base"
      # Reported, not gated: total coverage, plus changed-line coverage against the PR base on pull requests
      - name: Coverage report
        env:
          COVER_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: make -s coverage COVER_BASE="$COVER_BASE" >> "$GITHUB_STEP_SUMMARY"
      - run: make atlas-age

  # Builds the production backend image and applies migrations with the Atlas build that ships in it.
  stack:
    name: Compose stack (image + migrate + health)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # .env and the password files under .secrets/, as a developer gets them
      - run: make init-env
      - name: Each service gets only its own secrets
        run: |
          docker compose config --format json > /tmp/compose.json
          test "$(jq -c '.services.backend.secrets | map(.source)' /tmp/compose.json)" = '["db_app_password"]'
          test "$(jq -c '.services.migrate.secrets | map(.source)' /tmp/compose.json)" = '["db_owner_password"]'
          test "$(jq -c '.services.frontend.secrets // []' /tmp/compose.json)" = '[]'
          jq -e '.services.frontend.environment' /tmp/compose.json > /dev/null
          if jq -r '.services.frontend.environment | keys[]' /tmp/compose.json | grep -E '^(DATABASE|MIGRATE|POSTGRES|DB_)'; then
            echo "frontend receives database settings"; exit 1
          fi
      # Published ports bypass ufw: only caddy may have any (plan P10)
      - name: Only caddy publishes ports
        run: test "$(jq -c '[.services | to_entries[] | select(.value.ports) | .key]' /tmp/compose.json)" = '["caddy"]'
      - run: docker compose up -d --build --wait
      - name: Migrate exited cleanly and backend is ready
        run: |
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = 0
          docker compose exec -T backend /usr/local/bin/app healthcheck
      - name: Caddy serves the API and the pages on one origin
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/users/me)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/en/login)" = 200
          # the backend believes caddy's request id, so caddy must not pass on the client's (E5)
          id="$(curl -s -o /dev/null -D - -H 'X-Request-ID: client-chosen' http://localhost/api/users/me | tr -d '\r' | awk -F': ' 'tolower($1) == "x-request-id" {print $2}')"
          test -n "$id" && test "$id" != client-chosen
      - name: The app role cannot change the schema
        run: |
          out="$(docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U fullstack_app -d fullstack -c 'CREATE TABLE intruder (id int)' 2>&1)" && exit 1
          echo "$out"
          grep -q 'permission denied for schema public' <<< "$out"
      - if: failure()
        run: docker compose logs

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check git hooks were installed
        run: test -x "$(git rev-parse --git-path hooks)/commit-msg"
      - run: pnpm audit --prod --audit-level high
      # src/lib/api/schema.d.ts must match backend/api/openapi.yaml (plan I1)
      - run: pnpm gen:api:check
      - run: pnpm lint
      - run: pnpm check:deps
      - run: pnpm test
      - run: pnpm build
